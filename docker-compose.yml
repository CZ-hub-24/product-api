services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    networks:
      - product-network

  product-api:
    build: .
    container_name: product-api-container
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb
    networks:
      - product-network

networks:
  product-network:
    driver: bridge