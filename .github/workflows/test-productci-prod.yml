name: Product API CI Prod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-product-api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              echo ""
              echo "Product API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Product API did not start"
          cat server.log
          exit 1

      - name: CREATE Product
        run: |
          curl -fsS -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":1001,"pname":"CI Product","price":100000,"quantity":10}'

      - name: READ Product
        run: |
          RESPONSE=$(curl -fsS http://localhost:3000/api/products/1001)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"pid":1001'

      - name: UPDATE Product
        run: |
          RESPONSE=$(curl -fsS -X PUT http://localhost:3000/api/products/1001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"CI Product Updated","price":150000,"quantity":20}')

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"quantity":20'

      - name: DELETE Product
        run: |
          curl -fsS -X DELETE http://localhost:3000/api/products/1001

      - name: Verify Product Deleted
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:3000/api/products/1001)

          echo "HTTP Status: $STATUS"
          test "$STATUS" = "404"

      - name: Show API log if test fails
        if: failure()
        run: cat server.log || true

  docker-cd:
    needs: test-product-api
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}


  deploy-local:
    needs: docker-cd
    runs-on: [self-hosted, Windows, X64]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Show running containers
        run: docker compose -f docker-compose-prod.yaml ps
  